name: Build Umwalimu AI intent classifier
on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas scikit-learn joblib matplotlib jupyter nbconvert
      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=300 --output /tmp/umwalimu-executed.ipynb dataset/Portfolio_Project_2_Part_1_Classifier.ipynb
      - name: Verify generated files
        run: |
          test -s dataset/intents.csv
          test -s dataset/intent_classifier.joblib
